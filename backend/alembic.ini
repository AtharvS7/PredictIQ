# Predictify — Alembic Configuration
# Uses raw SQL migrations (no SQLAlchemy ORM models).

[alembic]
# Path to migration versions directory
script_location = alembic
# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(rev)s_%%(slug)s
# Truncate revision IDs to 12 characters
truncate_slug_length = 40
prepend_sys_path = .
# Timezone for revision timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
