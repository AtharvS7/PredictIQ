name: CI — Lint, Test, Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION:   "22"
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

jobs:

  # ── JOB 1: Python lint + type check ──────────────────────────────
  lint-backend:
    name: "Backend — Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r backend/requirements.lock.txt ruff mypy types-requests
      - name: "Ruff lint (style + import order)"
        run: ruff check backend/ --select E,W,F,I --ignore E501
      - name: "Type check (mypy)"
        run: |
          cd backend
          mypy app/ --ignore-missing-imports --no-strict-optional \
               --exclude 'ml/'

  # ── JOB 2: TypeScript type check ─────────────────────────────────
  lint-frontend:
    name: "Frontend — Type check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: "TypeScript strict check"
        run: cd frontend && npm run typecheck
      - name: "Frontend lint and regression tests"
        run: cd frontend && npm run lint && npm test
      - name: "Production dependency audit"
        run: cd frontend && npm audit --omit=dev --audit-level=high

  # ── JOB 3: Backend unit + integration tests ─────────────────────
  test-backend:
    name: "Backend — Tests"
    runs-on: ubuntu-latest
    needs: [lint-backend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: predictiq_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: predictiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predictiq_test -d predictiq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV:                   test
      APP_VERSION:               "3.1.0"
      DATABASE_URL:              postgresql://test:test@127.0.0.1:1/predictiq_test
      DEFAULT_HOURLY_RATE_USD:   "75"
      ML_MODEL_PATH:             ./ml/predictiq_best_model.pkl
      ML_SCALER_PATH:            ./ml/predictiq_scaler.pkl
      ML_FEATURES_PATH:          ./ml/predictiq_features.json
      PREDICTIQ_TEST_DATABASE_URL: postgresql://predictiq_test:test-only-password@127.0.0.1:5432/predictiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: "Install dependencies"
        run: |
          pip install -r backend/requirements.lock.txt
          pip install pytest pytest-asyncio httpx pytest-cov
          pip install pip-audit
          pip-audit -r backend/requirements.lock.txt --no-deps --disable-pip
      - name: "Copy env template"
        run: cp backend/.env.example backend/.env
      - name: "Apply canonical migrations to disposable database"
        working-directory: backend
        run: DATABASE_URL="$PREDICTIQ_TEST_DATABASE_URL" python -m alembic upgrade head
      - name: "Run tests with coverage"
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=xml --cov-report=term-missing
      - name: "Upload coverage report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ── JOB 4: Frontend build verification ──────────────────────────
  build-frontend:
    name: "Frontend — Build"
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: "Production build"
        run: |
          cd frontend
          VITE_API_BASE_URL=/api/v1 \
          VITE_APP_ENV=production \
          npm run build
      - name: "Upload build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ── JOB 5: Secret and security scan ─────────────────────────────
  security-scan:
    name: "Security — Secret + code scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Custom secret pattern scan"
        run: python scripts/pre_push_check.py
      - name: "Bandit SAST scan (Python security)"
        run: |
          pip install bandit
          bandit -r backend/app/ -lll \
            --exclude backend/app/tests/ \
            -f json -o bandit-report.json
      - name: "Upload Bandit report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
      - name: "Security regression checks"
        if: always()
        run: python -m unittest discover -s scripts/tests -v
      - name: "Check .env files not tracked"
        run: |
          COUNT=$(git ls-files backend/.env frontend/.env 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "FAIL: .env files are tracked by git!"
            git ls-files backend/.env frontend/.env
            exit 1
          fi
          echo "PASS: No .env files tracked"

  # ── JOB 6: Docker build verification (PRs only) ─────────────────
  docker-build-check:
    name: "Docker — Build check"
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, security-scan]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: "Build backend image"
        run: docker build -f Dockerfile.backend -t predictify-backend:ci .
      - name: "Build frontend image"
        run: |
          docker build -f Dockerfile.frontend -t predictify-frontend:ci \
            --build-arg VITE_FIREBASE_API_KEY \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN \
            --build-arg VITE_FIREBASE_PROJECT_ID \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID \
            --build-arg VITE_FIREBASE_APP_ID .
      - name: "Smoke test — frontend proxy, upload limits, and privacy"
        env:
          PREDICTIQ_TEST_FRONTEND_IMAGE: predictify-frontend:ci
        run: python -m unittest discover -s scripts/tests -p test_frontend_container.py -v
      - name: "Smoke test — packaged application imports and model predicts"
        run: |
          docker run --rm \
            -e APP_ENV=test \
            -e DATABASE_URL=postgresql://test:test@127.0.0.1:1/test \
            predictify-backend:ci python -c \
            "import main; from ml.inference import predictor; assert predictor.load(); assert predictor.is_ready"


