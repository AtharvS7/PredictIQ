name: Security — Weekly vulnerability audit

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main]

jobs:
  dependency-audit:
    name: "Dependency vulnerability scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Python — pip-audit"
        run: |
          pip install pip-audit
          pip install -r backend/requirements.lock.txt
          pip-audit --desc --format json -o pip-audit.json

      - name: "Node — npm audit"
        if: always()
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high --json > npm-audit.json

      - name: "Upload vulnerability reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            pip-audit.json
            frontend/npm-audit.json

      - name: "Create issue if vulnerabilities found"
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[Security] Dependency vulnerabilities detected',
                body: 'The weekly security audit found vulnerabilities. ' +
                      'Run: `pip-audit -r backend/requirements.lock.txt` and ' +
                      '`cd frontend && npm audit` to see details. ' +
                      'Update affected packages and rerun the pipeline.',
                labels: ['security', 'automated', 'priority-high']
              });
            }

