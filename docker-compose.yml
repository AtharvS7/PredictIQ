# ═══════════════════════════════════════════════════════════════
# Predictify — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════════
#
# Usage:
#   docker-compose up --build
#   Access: http://localhost:3000
#
# Prerequisites:
#   1. Copy backend/.env.example -> backend/.env (fill real values)
#   2. Ensure ML model artifacts exist in backend/ml/
# ═══════════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      APP_ENV: production
      # This single-host topology explicitly mounts a durable uploads volume.
      ALLOW_LOCAL_STORAGE_IN_PRODUCTION: "true"
    volumes:
      - ./backend/ml:/app/ml:ro
      - document-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - Predictify-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Set public Firebase build configuration}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Set public Firebase build configuration}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Set public Firebase build configuration}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?Set public Firebase build configuration}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:?Set public Firebase build configuration}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Set public Firebase build configuration}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - Predictify-net

networks:
  Predictify-net:
    driver: bridge

volumes:
  document-uploads:
