# ═══════════════════════════════════════════════════════════════
# PredictIQ — Nginx Configuration (Performance Optimized)
# Serves React SPA with API reverse proxy to FastAPI backend
# ═══════════════════════════════════════════════════════════════

# Keep all add_header directives at server scope: location-level cache headers
# otherwise suppress inherited security headers, including on the SPA shell.
map $uri $predictiq_cache_control {
    default "";
    /index.html "no-cache, no-store, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~*\.(woff2?|ttf|otf|eot)$ "public, max-age=31536000, immutable";
    ~*\.(png|jpg|jpeg|gif|ico|svg|webp)$ "public, max-age=2592000";
}

# SPA internal redirects finish in /index.html. A safe global log format keeps
# share tokens and query strings out of logs even after those redirects.
log_format predictiq_safe '$remote_addr $request_method $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name localhost;

    # Maximum upload size (for PDF/DOCX documents)
    client_max_body_size 11m;

    # ── Gzip Compression (optimized) ──────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/woff2
        font/woff;

    # Serve static files from React build
    root /usr/share/nginx/html;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $predictiq_cache_control;

    # React SPA — fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Share tokens are bearer credentials; omit raw access logs.
    location ^~ /share/ {
        access_log off;
        try_files $uri /index.html;
    }

    # API reverse proxy → FastAPI backend
    location ^~ /api/ {
        access_log off;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for ML prediction (may take a few seconds)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Enable proxy buffering for faster responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # Cache static assets aggressively (JS, CSS, images — hashed filenames)
    location /assets/ {
        access_log off;
    }

    # Cache fonts aggressively
    location ~* \.(woff2?|ttf|otf|eot)$ {
        access_log off;
    }

    # Cache images
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        access_log off;
    }

    # Do not cache the HTML shell (always fetch latest for SPA)
    location = /index.html {
        try_files $uri =404;
    }

    # Access and error logs
    access_log /var/log/nginx/access.log predictiq_safe;
    error_log /var/log/nginx/error.log;
}
