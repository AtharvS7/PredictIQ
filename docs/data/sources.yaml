# PredictIQ Dataset Source Registry (v2.0)
# Evaluated and categorized for honest software effort estimation

sources:
  - name: "China"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/china.arff"
    licence: "Open Academic Research / Public Domain (PROMISE Repository)"
    rows: 499
    size_unit: "FP"
    size_measure: "IFPUG Adjusted Function Points (AFP)"
    effort_unit: "person-hours"
    effort_field: "Effort"
    years: "2000-2008"
    domain: "Information systems, financial, government software in China"
    sha256: "ae9df9c52c5bc5ba03b9732ecc159093f0c500ffa0f3d8260ddd7350f0a22c58"
    issues: "Legacy pipeline in v1 erroneously mapped resource code to effort for 481 rows; verified fixed by selecting source Effort column directly."
    decision: "IN"
    reason: "Primary empirical dataset; clean named columns; valid IFPUG Function Points and real recorded person-hours."

  - name: "Kitchenham"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/kitchenham.arff"
    licence: "Open Research Data / Academic Citation"
    rows: 145
    size_unit: "FP"
    size_measure: "Adjusted.function.points"
    effort_unit: "person-hours"
    effort_field: "Actual.effort"
    years: "1994-1998"
    domain: "Commercial banking, retail, and back-office applications"
    sha256: "0832342b248418cca324cebe77d86d2f90ae223c1119af9360783bdbad0b2ac0"
    issues: "Some variance in counting duration across multiple contractors."
    decision: "IN"
    reason: "Established industry empirical study with audited actual effort and Function Points."

  - name: "Desharnais"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/Desharnais.csv"
    licence: "Open Research Data / PROMISE Repository"
    rows: 81
    size_unit: "FP"
    size_measure: "PointsAjust"
    effort_unit: "person-hours"
    effort_field: "Effort"
    years: "1988-1989"
    domain: "Canadian business applications (COBOL/4GL)"
    sha256: "38c5d00053555cbe7f3c10c2b026990ea981612ddefd5a7e0fcf8aa52bc4fd64"
    issues: "Historical dataset with older technology stack; relationships between size and effort remain valid."
    decision: "IN"
    reason: "Standard industry benchmark with reliable FP and effort hours."

  - name: "Maxwell"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/maxwell.arff"
    licence: "Open Research Data / PROMISE Repository"
    rows: 62
    size_unit: "FP"
    size_measure: "Size"
    effort_unit: "person-hours"
    effort_field: "Effort"
    years: "1990-1996"
    domain: "European space and aerospace agency contractor applications"
    sha256: "1adb2b23c638a553a2b2e2d83476d983d1be13d4e891c4148f2a90834472c235"
    issues: "High compliance/rigor aerospace domain exhibits lower average productivity (higher hours/FP)."
    decision: "IN"
    reason: "Rigorous measurements in high-reliability software; essential cross-domain diversity for LOSO."

  - name: "Albrecht"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/albrecht.arff"
    licence: "Public Domain / IBM Research Classical Benchmark"
    rows: 24
    size_unit: "FP"
    size_measure: "Function_Points"
    effort_unit: "person-hours"
    effort_field: "Effort"
    years: "1979-1983"
    domain: "IBM corporate data processing systems"
    sha256: "cfd9713c6a0a45e318fd5345d3f45ac1cfbbf59191d91a645eabd6541890fd18"
    issues: "Small sample size from the foundational Function Point paper."
    decision: "IN"
    reason: "Foundational benchmark for function point validation; clean hours."

  - name: "AT&T Aptness"
    url: "https://jse.amstat.org/datasets/aptness.dat.txt"
    licence: "Journal of Statistics Education / Open Educational & Research Use"
    rows: 104
    size_unit: "FP"
    size_measure: "Adjusted Function Points"
    effort_unit: "person-hours"
    effort_field: "Effort (hours)"
    years: "1986-1991"
    domain: "Telecommunications, network administration, internal IT"
    sha256: "92f4495226b89a26d5b1422e679445a4078bcca9905f08354988f796e3fcf210"
    issues: "Contains 3 categorical fields (OS, DBMS, Language) with missing values in other sources."
    decision: "IN"
    reason: "Independently curated external benchmark with real completed hours and FP."

  - name: "Finnish"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/finnish.arff"
    licence: "Open Research Data"
    rows: 38
    size_unit: "FP"
    size_measure: "FP"
    effort_unit: "person-hours"
    effort_field: "Effort"
    years: "1990-1994"
    domain: "Finnish corporate and banking software"
    sha256: "abaf7925580e89de54cb5d9d44b6f12e4db83aa80e2a7080ca57e62f8b91a42e"
    issues: "Ambiguity regarding whether sizing used standard IFPUG or Finnish national variant."
    decision: "OUT"
    reason: "Measurement ambiguity violates the zero-unrecorded-conversions rule."

  - name: "Kemerer"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/kemerer.arff"
    licence: "Open Research Data (CACM 1987)"
    rows: 15
    size_unit: "FP / KLOC"
    size_measure: "FP"
    effort_unit: "person-months"
    effort_field: "Months"
    years: "1980-1985"
    domain: "Commercial DP applications"
    sha256: "unverified"
    issues: "Only 15 rows; effort reported in person-months without audited hours-per-month."
    decision: "OUT"
    reason: "Sample size too small; unit conversion assumption would introduce unverified bias."

  - name: "NASA93 / COCOMO81"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/COCOMO-81.csv"
    licence: "Public Domain / NASA Cost Analysis Group"
    rows: 93
    size_unit: "KLOC"
    size_measure: "Lines of code (thousands)"
    effort_unit: "person-months"
    effort_field: "Effort"
    years: "1970-1990"
    domain: "Scientific, aerospace, command & control"
    sha256: "unverified"
    issues: "KLOC-based; no standard Function Point measurements."
    decision: "OUT"
    reason: "KLOC cannot be converted to Function Points without fabricating gearing factors (banned)."

  - name: "Miyazaki94"
    url: "https://zenodo.org/record/48"
    licence: "Zenodo Open Access"
    rows: 48
    size_unit: "KSLOC"
    size_measure: "KSLOC"
    effort_unit: "person-months"
    effort_field: "MM"
    years: "1990-1994"
    domain: "Fujitsu COBOL enterprise systems"
    sha256: "unverified"
    issues: "KSLOC sizing only."
    decision: "OUT"
    reason: "No Function Point measurements; excluded from FP-based model."

  - name: "COSMIC Literature Benchmark (Yürüm, Ünlü, Demirörs 2026)"
    url: "https://doi.org/10.1016/j.jss.2025.112591"
    licence: "Academic Open Access (Elsevier JSS / SoftW-AI Group)"
    rows: 337
    size_unit: "COSMIC"
    size_measure: "CFP (COSMIC Function Points)"
    effort_unit: "person-hours"
    effort_field: "Effort"
    years: "2000-2024"
    domain: "Mixed multi-domain literature compilation (18 studies)"
    sha256: "unverified"
    issues: "CFP functional size units are structurally distinct from IFPUG 1st generation Function Points."
    decision: "OUT"
    reason: "Cannot mix COSMIC units into IFPUG FP models without empirical conversion; reserved for a documented future COSMIC track."

  - name: "ISBSG (International Software Benchmarking Standards Group)"
    url: "https://www.isbsg.org/development-and-enhancement-data/"
    licence: "Commercial Paid License (Not purchased)"
    rows: 13147
    size_unit: "FP / COSMIC"
    size_measure: "Unadjusted and Adjusted FP"
    effort_unit: "person-hours"
    effort_field: "Summary Work Effort"
    years: "1995-2025"
    domain: "Global cross-industry software development"
    sha256: "none"
    issues: "Requires commercial purchase or academic partnership."
    decision: "OUT"
    reason: "Not purchased — future sponsored roadmap item. Ingestion architecture documented in ISBSG_PLAN.md."

research_track_only:
  - name: "JOSSE"
    url: "https://zenodo.org/records/7022735"
    licence: "Creative Commons Attribution 4.0 International"
    grain: "Issue / story level"
    reason: "Sub-project issue tracking data; strictly excluded from project-level total effort estimation."

  - name: "SiP"
    url: "https://raw.githubusercontent.com/Derek-Jones/SiP_dataset/master/"
    licence: "Open Research Data"
    grain: "Developer task level (10,100 tasks)"
    reason: "Task-level hours cannot be aggregated to project totals without tracking overhead."

  - name: "TAWOS"
    url: "https://github.com/SOLAR-group/TAWOS"
    licence: "Custom Research License (Apache 2.0 with terms)"
    grain: "Jira issue level (458k issues)"
    reason: "Issue-level story points are non-linear and not project totals."

  - name: "CESAW"
    url: "https://github.com/Derek-Jones/Software-estimation-datasets"
    licence: "Open Research Data"
    grain: "Task facts (203k records)"
    reason: "Granular individual developer task facts, not whole-project lifecycle effort."

  - name: "SDEE"
    url: "https://ieee-dataport.org/documents/sdee-software-development-effort-estimation-dataset"
    licence: "IEEE DataPort (Login / terms required)"
    grain: "GitHub repository developer activity proxies"
    reason: "Commit/PR activity proxies are not audited effort person-hours."
