  - name: "Albrecht"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/albrecht.arff"
    licence: "Public Domain / IBM Research Classical Benchmark"
    download_status: "ACQUIRED_AND_VERIFIED"
