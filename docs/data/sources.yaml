  # ============================================================================
  # SECTION 2: AUDITED EXTERNAL CANDIDATE DATASETS (Evaluated in S03)
  # All non-FP or non-person-hour sources are placed in specialized tracks (OUT of primary FP)
  # ============================================================================
  - name: "Tukutuku (Mendes et al.)"
    url: "https://www.cs.auckland.ac.nz/~emilia/tukutuku/"
    licence: "Proprietary / Multi-Company Non-Disclosure Agreement (Academic Request Only)"
    download_status: "BLOCKED_BY_NDA"
    rows: 195
    size_unit: "Web Objects / Page Counts"
    size_measure: "New Pages, Dynamic Pages, Media Counts, Web Objects"
    effort_unit: "person-hours"
    effort_field: "TotEffort"
    years: "2000-2008"
    domain: "Web engineering and commercial web application development"
    sha256: "none"
    issues: "Data collected under commercial non-disclosure agreements; no public unrestricted HTTP download available on GitHub, Zenodo, or Figshare."
    decision: "OUT"
    reason: "Access is gated by academic NDA. Sizing metrics are web objects and page counts rather than IFPUG Function Points. Documented in MANUAL_DOWNLOADS.md."

  - name: "SEERA (Sudan Software Cost Estimation)"
    url: "https://zenodo.org/records/4028352"
    licence: "Creative Commons Attribution 4.0 International (CC-BY-4.0)"
    download_status: "ACQUIRED_AND_VERIFIED"
    rows: 120
    size_unit: "OP"
    size_measure: "COCOMO II Object Points (Screen + Report counts)"
    effort_unit: "person-hours"
    effort_field: "Actual effort (Main)"
    years: "2013-2018"
    domain: "Sudanese government, banking, and commercial software industry"
    sha256: "ac74dc0e0541fb00c0a520cae5f33fb86e3981881822830f0fcf7cf39be0d750"
    issues: "Uses COCOMO II Object Points rather than IFPUG Function Points."
    decision: "OUT"
    reason: "Strict Rule 3 compliance: Object Points cannot be mathematically converted to Function Points without fabricating unverified gearing factors. Tracked in dedicated non-FP Object Points track."

  - name: "Kemerer"
    url: "https://zenodo.org/records/268464/files/kemerer.arff?download=1"
    licence: "Open Research Data / CACM 1987 / PROMISE Repository"
    download_status: "ACQUIRED_AND_VERIFIED"
    rows: 15
    size_unit: "FP"
    size_measure: "Adjusted FP (AdjFP) / RAWFP / KSLOC"
    effort_unit: "person-months"
    effort_field: "EffortMM"
    years: "1980-1985"
    domain: "Commercial DP business applications"
    sha256: "04b46eb8c106ad39d6076ad60dc00f1d51045e631421bc61050c85c15a20402d"
    issues: "Only 15 projects; effort recorded strictly in person-months without audited hours-per-month."
    decision: "OUT"
    reason: "Strict Rule 3 compliance: Converting person-months to person-hours requires an unrecorded assumption (e.g., 152 vs 160 hrs/mo), violating zero-unrecorded-conversions rule. Tracked in non-work-hours track."

  - name: "Finnish (TIEKE / STTF)"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/finnish.arff"
    licence: "Open Research Data / TIEKE STTF Benchmark"
    download_status: "ACQUIRED_AND_VERIFIED"
    rows: 38
    size_unit: "FiSMA FP"
    size_measure: "FiSMA Function Points (ISO/IEC 29881)"
    effort_unit: "person-hours"
    effort_field: "dev.eff.hrs."
    years: "1990-1994"
    domain: "Finnish corporate and banking software"
    sha256: "abaf7925580e89de54cb5d9d44b6f12e4db83aa80e2a7080ca57e62f8b91a42e"
    issues: "Sizing methodology is FiSMA (Finnish Software Measurement Association) standard, which diverges in base weights and classification rules from IFPUG CPM 4.x."
    decision: "OUT"
    reason: "FiSMA functional size divergence violates zero-unrecorded-conversions rule. Tracked in dedicated national standard track."

