# PredictIQ Dataset Source Registry (v3.0 - S03 Provenance Expansion)
# Rigorously audited against license, sizing standard, effort unit, and zero-fabrication policies.

sources:
  # ============================================================================
  # SECTION 1: APPROVED PRIMARY DATASETS (projects_v2 / v3 Core Training Set)
  # Total Projects: 915 | Sizing: IFPUG Function Points (FP) | Effort: Person-Hours
  # ============================================================================
  - name: "China"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/china.arff"
    licence: "Open Academic Research / Public Domain (PROMISE Repository)"
    download_status: "ACQUIRED_AND_VERIFIED"
    rows: 499
    size_unit: "FP"
    size_measure: "IFPUG Adjusted Function Points (AFP)"
    effort_unit: "person-hours"
    effort_field: "Effort"
    years: "2000-2008"
    domain: "Information systems, financial, government software in China"
    sha256: "ae9df9c52c5bc5ba03b9732ecc159093f0c500ffa0f3d8260ddd7350f0a22c58"
    issues: "Legacy pipeline in v1 erroneously mapped resource code to effort for 481 rows; verified fixed by selecting source Effort column directly."
    decision: "IN"
    reason: "Primary empirical dataset; clean named columns; valid IFPUG Function Points and real recorded person-hours."

  - name: "Kitchenham"
    url: "https://raw.githubusercontent.com/Derek-Jones/Software-estimation-datasets/main/kitchenham.arff"
    licence: "Open Research Data / Academic Citation"
    download_status: "ACQUIRED_AND_VERIFIED"
    rows: 145
    size_unit: "FP"
    size_measure: "Adjusted.function.points"
    effort_unit: "person-hours"
    effort_field: "Actual.effort"
    years: "1994-1998"
    domain: "Commercial banking, retail, and back-office applications"
    sha256: "0832342b248418cca324cebe77d86d2f90ae223c1119af9360783bdbad0b2ac0"
    issues: "Some variance in counting duration across multiple contractors."
    decision: "IN"
    reason: "Established industry empirical study with audited actual effort and Function Points."

  - name: "Desharnais"
